name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Only used by the last step, which runs on main.
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key from secrets
        env:
          DRIVE_KEYSTORE_B64: ${{ secrets.DRIVE_KEYSTORE_B64 }}
        run: |
          if [ -n "$DRIVE_KEYSTORE_B64" ]; then
            mkdir -p keystore && echo "$DRIVE_KEYSTORE_B64" | base64 -d > keystore/drive.p12
          else
            echo "::warning::No DRIVE_KEYSTORE_B64 secret: throwaway debug key, uninstall before updating"
          fi
      - env:
          DRIVE_KEYSTORE_PASSWORD: ${{ secrets.DRIVE_KEYSTORE_PASSWORD }}
        run: chmod +x gradlew && ./gradlew --no-daemon lintDebug assembleDebug
      - run: cp app/build/outputs/apk/debug/stargayzer-drive-debug.apk stargayzer-drive.apk
      - uses: actions/upload-artifact@v4
        with:
          name: stargayzer-drive
          path: |
            stargayzer-drive.apk
            app/build/reports/lint-results-debug.html
      # A rolling pre-release, so the laptop or the Pi can download the APK without a GitHub login.
      - name: Publish drive-latest pre-release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete drive-latest --yes --cleanup-tag || true
          gh release create drive-latest stargayzer-drive.apk --prerelease \
            --target "$GITHUB_SHA" --title "StarGayzer Drive (latest build)" \
            --notes "Build of ${GITHUB_SHA::7}. adb install -r updates in place (fixed key)."
